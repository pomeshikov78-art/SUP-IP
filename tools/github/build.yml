name: Сборка и испытания СУП-ИП

# ТЗ §7 (развёртывание одним EXE) и §15 (приёмочные испытания).
#   tests    — интеграционные испытания API, генератора документов и центра уведомлений
#              на PostgreSQL (Linux);
#   windows  — сборка SUP-IP.exe (PyInstaller, one-file) и самотестирование поставки;
#   installer— сборка SUP-IP-Setup-x.y.z.exe (NSIS; makensis собирает Windows-установщик
#              и на Linux, что исключает зависимость от Chocolatey на раннере),
#              публикация артефактов и Release с готовыми EXE по тегу версии.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_postgres:
        description: 'Включить офлайн-установщик PostgreSQL в пакет (~350 МБ)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tests:
    name: Интеграционные испытания (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: supip
          POSTGRES_PASSWORD: supip
          POSTGRES_DB: supip
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Зависимости
        run: python -m pip install --upgrade pip psycopg2-binary
      - name: Запуск сервера
        working-directory: sup-ip
        env:
          SUPIP_DSN: host=127.0.0.1 port=5432 dbname=supip user=supip password=supip
        run: |
          python server.py --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=2)" 2>/dev/null; then exit 0; fi
            sleep 1
          done
          cat server.log; exit 1
      - name: Испытания генератора документов (без БД)
        working-directory: sup-ip
        run: python tests/docgen_test.py
      - name: Испытания API
        working-directory: sup-ip
        run: python tests/api_test.py --base http://127.0.0.1:8000
      - name: Испытания выгрузки DOCX/XLSX/PDF
        working-directory: sup-ip
        run: python tests/export_test.py --base http://127.0.0.1:8000
      - name: Испытания центра уведомлений и напоминаний
        working-directory: sup-ip
        run: python tests/notif_test.py --base http://127.0.0.1:8000
      - name: Испытания файлового журналирования
        working-directory: sup-ip
        run: python tests/log_test.py --base http://127.0.0.1:8000
      - name: Испытания маршрута согласования и версий протокола
        working-directory: sup-ip
        run: python tests/protocol_test.py --base http://127.0.0.1:8000
      - name: Испытания поручений из решений совещаний
        working-directory: sup-ip
        run: python tests/directive_test.py --base http://127.0.0.1:8000
      - name: Испытания реестра поручений и приёмки результата
        working-directory: sup-ip
        run: python tests/registry_test.py --base http://127.0.0.1:8000
      - name: Испытания контроля сроков и отчётности по поручениям
        working-directory: sup-ip
        run: python tests/control_test.py --base http://127.0.0.1:8000
      - name: Испытания планирования совещаний (ТЗ §2.5)
        working-directory: sup-ip
        run: python tests/planning_test.py --base http://127.0.0.1:8000
      - name: Испытания установки, запуска и журналов (со сборкой сценария NSIS)
        working-directory: sup-ip
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nsis
          python tests/setup_test.py --base http://127.0.0.1:8000 --nsis
      - name: Журнал сервера (при сбое)
        if: failure()
        run: cat sup-ip/server.log

  windows:
    name: Сборка SUP-IP.exe (Windows x64)
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Зависимости сборки
        run: python -m pip install --upgrade pip pyinstaller psycopg2-binary pywin32 cryptography
      - name: Сборка SUP-IP.exe (PyInstaller, one-file)
        working-directory: sup-ip
        shell: pwsh
        run: |
          $args = @('--onefile','--name','SUP-IP','--clean','--noconfirm',
                    '--add-data','static;static',
                    '--hidden-import','win32timezone','--hidden-import','win32serviceutil',
                    '--hidden-import','win32service','--hidden-import','servicemanager',
                    '--hidden-import','psycopg2','--hidden-import','cryptography')
          if (Test-Path 'assets') { $args += @('--add-data','assets;assets') }
          if (Test-Path 'docgen.py') { $args += @('--hidden-import','docgen') }
          python -m PyInstaller @args server.py
      - name: Самотестирование EXE (без БД)
        shell: pwsh
        run: |
          .\sup-ip\dist\SUP-IP.exe --version
          .\sup-ip\dist\SUP-IP.exe --selftest
      - name: Артефакт SUP-IP.exe
        uses: actions/upload-artifact@v4
        with:
          name: SUP-IP-exe
          path: sup-ip/dist/SUP-IP.exe
          if-no-files-found: error

  installer:
    name: Установщик SUP-IP-Setup.exe (NSIS)
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - name: Установка NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nsis
      - name: Версия
        id: ver
        run: |
          v=$(grep -oP '^VERSION = "\K[0-9.]+' sup-ip/server.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Версия: $v"
      - name: Получение SUP-IP.exe
        uses: actions/download-artifact@v4
        with:
          name: SUP-IP-exe
          path: sup-ip/dist
      - name: Офлайн-пакет PostgreSQL (для полного установщика)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.bundle_postgres)
        run: |
          curl -L --retry 3 --connect-timeout 30 -o sup-ip/installer/postgresql-setup.exe \
            https://get.enterprisedb.com/postgresql/postgresql-16.4-1-windows-x64.exe
          ls -lh sup-ip/installer/postgresql-setup.exe
      - name: Сборка полного установщика (PostgreSQL внутри, без интернета)
        if: hashFiles('sup-ip/installer/postgresql-setup.exe') != ''
        working-directory: sup-ip
        run: |
          makensis -V2 -DVERSION=${{ steps.ver.outputs.version }} installer/setup.nsi
          rm -f installer/postgresql-setup.exe
      - name: Сборка компактного установщика
        working-directory: sup-ip
        run: |
          makensis -V2 -DVERSION=${{ steps.ver.outputs.version }} installer/setup.nsi
          ls -lh dist
          python3 - <<'EOF'
          import glob
          for f in sorted(glob.glob('dist/*.exe')):
              sig = open(f,'rb').read(2)
              print(f, 'Windows PE' if sig == b'MZ' else 'ОШИБКА СИГНАТУРЫ', sig)
              assert sig == b'MZ', f
          EOF
      - name: Стабильные имена файлов для постоянных ссылок
        working-directory: sup-ip
        run: |
          cp "dist/SUP-IP-Setup-${{ steps.ver.outputs.version }}.exe" dist/SUP-IP-Setup.exe
          if [ -f "dist/SUP-IP-Setup-full-${{ steps.ver.outputs.version }}.exe" ]; then
            cp "dist/SUP-IP-Setup-full-${{ steps.ver.outputs.version }}.exe" dist/SUP-IP-Setup-full.exe
          fi
      - name: Артефакты поставки
        uses: actions/upload-artifact@v4
        with:
          name: SUP-IP-windows-x64
          path: |
            sup-ip/dist/SUP-IP.exe
            sup-ip/dist/SUP-IP-Setup-*.exe
          if-no-files-found: error
      - name: Публикация Release (по тегу версии)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.ver.outputs.version }}
          files=("sup-ip/dist/SUP-IP.exe" "sup-ip/dist/SUP-IP-Setup-$v.exe" "sup-ip/dist/SUP-IP-Setup.exe" "SUP-IP_server.zip")
          if [ -f "sup-ip/dist/SUP-IP-Setup-full-$v.exe" ]; then
            files+=("sup-ip/dist/SUP-IP-Setup-full-$v.exe" "sup-ip/dist/SUP-IP-Setup-full.exe")
          fi
          gh release create "v$v" --title "СУП-ИП v$v" --notes-file CHANGELOG.md "${files[@]}" \
          || gh release upload "v$v" "${files[@]}" --clobber

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СУП-ИП — система управления проектами инженерного подразделения</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='21' font-size='11' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'%3EСУП%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --line:#e2e7f0; --line2:#cbd5e1;
  --ink:#1b2537; --mut:#64748b; --mut2:#94a3b8;
  --acc:#2563eb; --acc-d:#1e40af; --acc-bg:#eff6ff;
  --ok:#16a34a; --ok-bg:#f0fdf4; --warn:#d97706; --warn-bg:#fffbeb;
  --err:#dc2626; --err-bg:#fef2f2; --info:#0891b2; --info-bg:#ecfeff;
  --side:#0e1726; --side2:#16233a; --side-tx:#9db0ca;
  --r:10px; --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --sh2:0 8px 28px rgba(16,24,40,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--acc);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c3cddc;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
svg.ic{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}

/* ===== LOGIN ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 20% -10%,#1c3a6e 0%,#0e1726 55%),#0e1726;padding:24px}
.login-box{width:860px;max-width:96vw;background:var(--panel);border-radius:16px;box-shadow:var(--sh2);overflow:hidden;display:grid;grid-template-columns:300px 1fr}
.login-left{background:linear-gradient(160deg,#12233f,#0e1726);color:#dbe6f5;padding:30px 26px;display:flex;flex-direction:column;gap:14px}
.login-left h1{font-size:26px;letter-spacing:.5px;color:#fff}
.login-left .sub{color:#8fa5c4;font-size:12.5px;line-height:1.55}
.login-left .arch{margin-top:auto;font-size:11.5px;color:#7d93b4;line-height:1.7;border-top:1px solid #24344f;padding-top:14px}
.login-right{padding:28px 30px}
.login-right h2{font-size:17px;margin-bottom:4px}
.login-right .hint{color:var(--mut);font-size:12.5px;margin-bottom:16px}
.user-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.user-pick{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;transition:.15s;background:#fff}
.user-pick:hover{border-color:var(--acc);background:var(--acc-bg)}
.user-pick.sel{border-color:var(--acc);background:var(--acc-bg);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.user-pick .nm{font-weight:600;font-size:12.5px;line-height:1.25}
.user-pick .rl{font-size:11px;color:var(--mut)}
.login-row{display:flex;gap:10px;align-items:center}
.login-row input{flex:1;border:1.5px solid var(--line2);border-radius:8px;padding:9px 12px;outline:none}
.login-row input:focus{border-color:var(--acc)}
.login-err{color:var(--err);font-size:12.5px;margin-top:10px;min-height:18px}
.login-foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut2);display:flex;justify-content:space-between;align-items:center}

/* ===== SHELL ===== */
.shell{display:grid;grid-template-columns:236px 1fr;grid-template-rows:56px 1fr;height:100vh;overflow:hidden}
.sidebar{grid-row:1/3;background:var(--side);color:var(--side-tx);display:flex;flex-direction:column;overflow:hidden}
.logo{display:flex;align-items:center;gap:10px;padding:14px 16px;color:#fff;border-bottom:1px solid #1d2c45}
.logo .mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#0ea5e9);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;letter-spacing:.5px}
.logo b{font-size:15px;letter-spacing:.4px}
.logo small{display:block;font-size:10px;color:#7d93b4;font-weight:400;letter-spacing:.2px}
.nav{flex:1;overflow-y:auto;padding:8px 10px 14px}
.nav::-webkit-scrollbar-thumb{background:#2b3d5c;border:2px solid transparent;background-clip:content-box}
.nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#5c7295;margin:13px 8px 5px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;color:var(--side-tx);font-size:13px;margin-bottom:1px;transition:.12s;cursor:pointer}
.nav a:hover{background:var(--side2);color:#e5edf8}
.nav a.on{background:var(--acc);color:#fff;font-weight:600}
.nav a .cnt{margin-left:auto;font-size:10.5px;background:#22334f;color:#9db0ca;border-radius:9px;padding:1px 7px}
.nav a.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.side-foot{padding:10px 12px;border-top:1px solid #1d2c45;font-size:11px;color:#6c82a3}
.side-foot button{display:flex;gap:8px;align-items:center;color:#9db0ca;padding:6px 6px;border-radius:7px;width:100%;font-size:12px}
.side-foot button:hover{background:var(--side2);color:#fff}
.storage-chip{display:flex;gap:6px;align-items:center;margin-top:6px;padding:0 6px}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex:none}
.dot.warn{background:#f59e0b}.dot.err{background:#ef4444}

.topbar{grid-column:2;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;position:relative;z-index:40}
.crumb{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px;white-space:nowrap}
.crumb .mcode{font-size:10.5px;font-weight:700;color:var(--acc);background:var(--acc-bg);border:1px solid #bfdbfe;padding:1px 7px;border-radius:6px;letter-spacing:.5px}
.demo-chip{font-size:10.5px;font-weight:700;color:#92400e;background:#fef3c7;border:1px solid #fde68a;padding:2px 8px;border-radius:6px;letter-spacing:.6px}
.searchbox{margin-left:auto;position:relative;width:300px}
.searchbox input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px 7px 32px;outline:none;font-size:12.5px}
.searchbox input:focus{border-color:var(--acc);background:#fff}
.searchbox .ic{position:absolute;left:9px;top:8px;color:var(--mut2)}
.searchbox kbd{position:absolute;right:8px;top:7px;font-size:10px;color:var(--mut2);border:1px solid var(--line2);border-radius:4px;padding:0 4px;background:#fff}
.search-pop{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh2);max-height:380px;overflow:auto;padding:6px;z-index:60}
.search-pop .sg{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mut2);padding:6px 8px 2px}
.search-pop .si{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12.5px}
.search-pop .si:hover{background:var(--acc-bg)}
.search-pop .si small{color:var(--mut);margin-left:auto;white-space:nowrap}
.sync{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);white-space:nowrap}
.sync .dot{animation:none}
.sync.pulse .dot{animation:pulse .6s}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}100%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
.iconbtn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mut);position:relative}
.iconbtn:hover{background:var(--bg);color:var(--ink)}
.iconbtn .bdg{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--err);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
.notif-pop{position:absolute;top:48px;right:64px;width:380px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);z-index:70;max-height:440px;overflow:auto}
.notif-pop h4{padding:12px 14px 8px;font-size:13px;border-bottom:1px solid var(--line)}
.notif-pop .ni{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
.notif-pop .ni:hover{background:var(--bg)}
.notif-pop .ni .ic{margin-top:1px}
.notif-pop .ni small{display:block;color:var(--mut);font-size:11px}
.userchip{display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:9px;cursor:pointer}
.userchip:hover{background:var(--bg)}
.userchip .un{font-size:12.5px;font-weight:600;line-height:1.2}
.userchip .ur{font-size:10.5px;color:var(--mut)}
.avatar{width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;letter-spacing:.3px}
.avatar.sm{width:22px;height:22px;font-size:9px}
.avatar.lg{width:44px;height:44px;font-size:15px}

.main{grid-column:2;overflow-y:auto;padding:20px 22px 60px;position:relative}
.view{max-width:1500px;margin:0 auto;animation:fadein .18s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== COMMON ===== */
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:19px}
.page-head .desc{color:var(--mut);font-size:12.5px;margin-top:2px;max-width:760px}
.page-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;border:1.5px solid var(--line2);background:#fff;color:var(--ink);transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--mut2);background:var(--bg)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-d);border-color:var(--acc-d)}
.btn.danger{color:var(--err);border-color:#fecaca}
.btn.danger:hover{background:var(--err-bg);border-color:var(--err)}
.btn.ok{color:var(--ok);border-color:#bbf7d0}
.btn.ok:hover{background:var(--ok-bg)}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:7px;gap:5px}
.btn.sm .ic{width:14px;height:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mut)}
.btn.ghost:hover{background:var(--bg);color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .ch{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.card .ch .ic{color:var(--acc)}
.card .ch .r{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:400}
.card .cb{padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:1fr 2fr}
@media(max-width:1250px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1100px){.shell{grid-template-columns:64px 1fr}.logo b,.logo small,.nav a span,.nav .grp,.nav a .cnt,.side-foot .txt{display:none}.nav a{justify-content:center}.g2,.g3,.g23,.g32{grid-template-columns:1fr}.searchbox{width:180px}}

.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:13px 15px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;cursor:pointer;transition:.15s}
.kpi:hover{border-color:var(--acc);transform:translateY(-1px)}
.kpi .kv{font-size:24px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .kl{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .ks{font-size:10.5px;color:var(--mut2)}
.kpi .ki{position:absolute;right:11px;top:11px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.kpi.tone-ok .ki{background:var(--ok-bg);color:var(--ok)}
.kpi.tone-warn .ki{background:var(--warn-bg);color:var(--warn)}
.kpi.tone-err .ki{background:var(--err-bg);color:var(--err)}
.kpi.tone-acc .ki{background:var(--acc-bg);color:var(--acc)}
.kpi.tone-info .ki{background:var(--info-bg);color:var(--info)}
.kpi.tone-ok .kv{color:var(--ok)}.kpi.tone-warn .kv{color:var(--warn)}.kpi.tone-err .kv{color:var(--err)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input[type=text],.filters input[type=date],.filters input[type=number]{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px;outline:none;max-width:230px}
.filters select:focus,.filters input:focus{border-color:var(--acc)}
.filters .fl{font-size:11px;color:var(--mut2);font-weight:600;margin-right:-3px}
.filters .spacer{flex:1}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:6px 12px;font-size:12px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.seg button:not(.on):hover{background:var(--bg)}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut2);padding:9px 12px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap;position:sticky;top:0;z-index:2}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:.1s}
.tbl tbody tr:hover{background:var(--acc-bg)}
.tbl tr.nohover{cursor:default}
.tbl tr.nohover:hover{background:inherit}
.tbl .num{font-variant-numeric:tabular-nums;text-align:right}
.tbl-wrap{overflow:auto;max-height:640px;border-radius:0 0 var(--r) var(--r)}
.tbl .sub{font-size:11px;color:var(--mut)}
.link{color:var(--acc);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;line-height:1.5}
.badge .bd{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--bg);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.prio{font-size:10.5px;font-weight:800;letter-spacing:.3px}
.overdue{display:inline-flex;align-items:center;gap:4px;color:var(--err);font-size:11px;font-weight:700;white-space:nowrap}
.overdue .ic{width:13px;height:13px}
.progress{height:7px;background:#e8edf5;border-radius:5px;overflow:hidden;min-width:70px}
.progress i{display:block;height:100%;border-radius:5px;background:var(--acc);transition:width .3s}
.progress.ok i{background:var(--ok)}.progress.warn i{background:var(--warn)}.progress.err i{background:var(--err)}
.prow{display:flex;align-items:center;gap:8px}
.prow b{font-size:11.5px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}

.empty{padding:38px 20px;text-align:center;color:var(--mut2)}
.empty .ic{width:34px;height:34px;stroke-width:1.3;margin-bottom:8px;color:#b6c2d4}
.empty b{display:block;color:var(--mut);font-size:13px;margin-bottom:3px}
.empty p{font-size:12px}
.skel{border-radius:var(--r);background:linear-gradient(90deg,#e8edf4 25%,#f3f6fb 50%,#e8edf4 75%);background-size:200% 100%;animation:sk 1.1s infinite}
@keyframes sk{to{background-position:-200% 0}}
.noaccess{max-width:480px;margin:70px auto;text-align:center;padding:36px}
.noaccess .ic{width:44px;height:44px;color:var(--err);stroke-width:1.4}
.noaccess h3{margin:10px 0 6px}
.noaccess p{color:var(--mut);font-size:12.5px}

.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.tabs button:hover:not(.on){color:var(--ink)}

/* ===== MODAL / DRAWER / TOAST ===== */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;animation:fadein .15s;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:14px;box-shadow:var(--sh2);width:600px;max-width:96vw;max-height:86vh;display:flex;flex-direction:column;animation:pop .18s}
.modal.wide{width:900px}
.modal.xwide{width:1100px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal .mh{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal .mh h3{font-size:15px;flex:1}
.modal .mb{padding:18px 20px;overflow-y:auto}
.modal .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;align-items:center;background:#f8fafc;border-radius:0 0 14px 14px}
.modal .mf .left{margin-right:auto;font-size:11.5px;color:var(--mut)}
.drawer-ov{position:fixed;inset:0;background:rgba(15,23,42,.3);z-index:90;animation:fadein .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:620px;max-width:96vw;background:#fff;box-shadow:-8px 0 30px rgba(16,24,40,.18);z-index:95;display:flex;flex-direction:column;animation:slide .22s}
.drawer.wide{width:780px}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer .dh h3{font-size:16px;line-height:1.3}
.drawer .dh .code{font-size:11px;color:var(--mut2);font-weight:700;letter-spacing:.5px}
.drawer .db{flex:1;overflow-y:auto;padding:16px 20px 30px}
.drawer .df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;background:#f8fafc;flex-wrap:wrap}
.xbtn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.xbtn:hover{background:var(--bg);color:var(--ink)}

.form{display:grid;gap:12px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:4px}
.field label .req{color:var(--err)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line2);border-radius:8px;padding:8px 11px;outline:none;font-size:13px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.field textarea{resize:vertical;min-height:70px}
.field .fh{font-size:11px;color:var(--mut2);margin-top:3px}
.field input.err,.field select.err{border-color:var(--err)}
.fmsg{font-size:12px;color:var(--err);min-height:16px}
.checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.checkline input{width:15px;height:15px;accent-color:var(--acc)}

.toasts{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:400px}
.toast{background:#0f1b2d;color:#e8eefb;border-radius:11px;padding:12px 15px;font-size:12.5px;box-shadow:var(--sh2);display:flex;gap:10px;align-items:flex-start;animation:tin .25s;border-left:3px solid var(--acc)}
.toast.ok{border-left-color:#22c55e}.toast.ok .ic{color:#4ade80}

/* ---------- Утилиты ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const DAY = 86400000;
const dISO = d => { const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const D = off => dISO(new Date(TODAY.getTime()+off*DAY));           // дата со смещением от сегодня
const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const diffD = (a,b) => Math.round((parseD(a)-parseD(b))/DAY);
const isWk = d => { const w=parseD(d).getDay(); return w===0||w===6; };
const fmtD = s => s ? parseD(s).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';

const fmtDT = ts => new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const fmtT = ts => new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

const plural = (n,a,b,c)=>{const m=n%100;if(m>=11&&m<=14)return c;const k=n%10;return k===1?a:(k>=2&&k<=4?b:c);};

/* Безопасное хранилище (в песочнице localStorage может быть недоступен) */
const store = (()=>{ let ok=true; const mem={};
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ ok=false; }
  return { ok,
    get:k=>{ try{ return ok?localStorage.getItem(k):(mem[k]??null); }catch(e){ return mem[k]??null; } },
    set:(k,v)=>{ try{ if(ok)localStorage.setItem(k,v); else mem[k]=v; }catch(e){ mem[k]=v; } },
    del:k=>{ try{ if(ok)localStorage.removeItem(k); delete mem[k]; }catch(e){ delete mem[k]; } } };

 link:{name:'Бюджет радиолинии', ver:'2.1', cat:'Радиотехнические расчёты', icon:'calc',

  inputs:[

 coverage:{name:'Зона покрытия', ver:'1.3', cat:'Расчёты зон покрытия', icon:'target',
  desc:'Оценка радиуса зоны обслуживания и требуемого числа базовых станций для заданной площади.',
  inputs:[
   {k:'f',n:'Частота',u:'МГц',def:2400,min:30,max:80000},
   {k:'ptx',n:'Мощность передатчика',u:'дБм',def:30,min:-10,max:60},
   {k:'gtx',n:'Усиление антенны БС',u:'дБи',def:12,min:0,max:40},
   {k:'grx',n:'Усиление антенны абонента',u:'дБи',def:2,min:0,max:30},
   {k:'lmisc',n:'Запас на затенение и прочие потери',u:'дБ',def:12,min:0,max:40},
   {k:'sens',n:'Чувствительность приёмника',u:'дБм',def:-95,min:-130,max:-30},

 reliability:{name:'Надёжность изделия (MTBF)', ver:'1.0', cat:'Расчёты надёжности', icon:'shield',
  desc:'Оценка средней наработки на отказ, вероятности безотказной работы и коэффициента готовности по группам комплектующих.',

 capacity:{name:'Пропускная способность канала', ver:'1.1', cat:'Расчёты пропускной способности', icon:'chart',

/* клиентское зеркало матрицы прав — для UX (скрытие кнопок). Авторитетная проверка — на сервере. */
function can(mod, op, obj){
 const u=App.user; if(!u||!DB) return false;
 const list=(perms()[u.role]||{})[mod]||[];
 if(!list.includes(op)) return false;
 if(u.role==='pm' && obj){
  if(obj.pm && obj.pm!==u.id && ['edit','approve','delete'].includes(op)) return false;
  if(obj.projectId){ const pr=P(obj.projectId); if(pr && pr.pm!==u.id && ['edit','approve','delete'].includes(op) && (mod==='portfolio'||mod==='gantt'||mod==='calcs'||mod==='docs'||mod==='risks'||mod==='tasks'||mod==='time')) return false; }
 }
 if(u.role==='exec' && obj && mod==='tasks' && op==='edit' && obj.assignee!==u.id) return false;
 if(u.role==='exec' && obj && mod==='time' && op==='edit' && obj.userId!==u.id) return false;
 return true;
}
function deny(mod, op, obj){
 toast('err','403 · Недостаточно прав','Операция «'+(OP_RU[op]||op)+'» недоступна для роли «'+(App.user?ROLES[App.user.role].name:'—')+'». Авторитетная проверка выполняется сервером; отказ фиксируется в журнале M15.');
 return false;
}

function guard(mod, op, obj){ if(can(mod,op,obj)) return true; deny(mod,op,obj); return false; }
/* единая точка мутаций: RPC → серверная проверка прав → операция → аудит → новое состояние → UI */
async function rpc(action, payload){
 let r, j;
 try{
  r = await fetch('/api/rpc', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action, payload:payload||{}})});
  j = await r.json();
 }catch(e){ toast('err','Сервер недоступен','Проверьте подключение к серверу СУП-ИП: '+e.message); return false; }
 if(j.state){ DB=j.state; if(DB.me) App.user=DB.users.find(u=>u.id===DB.me)||App.user; }
 if(!j.ok){
  const e=j.error||{};
  if(r.status===401){ stopPolling(); App.user=null; renderLogin(); toast('info','Требуется вход', e.message||'Сессия завершена'); return false; }
  toast('err', e.title||'Операция отклонена', e.message||'');
  return false;
 }
 if(j.msg) toast(j.msg.tone==='warn'?'warn':'ok', j.msg.title, j.msg.sub||'');
 dbSave(); renderView(); updateNotifBadge();
 return j.result===undefined ? true : j.result;
}

function log(cat, level, module, action, obj, objId, details){
 if(!DB||!App.user) return;
 if(!['TECH','INTEGRATION','AUDIT'].includes(cat)) return; // BUSINESS/SECURITY пишет только сервер
 fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({action:'client.log',payload:{cat,level,module,action,obj,objId:objId||'',details:details||{}}})}).catch(()=>{});
}

/* ---------- Графики (чистый SVG, без внешних библиотек) ---------- */
function donutSVG(items, size, thick, centerLabel){
 size=size||150; thick=thick||20;
 const total=sum(items.map(i=>i.value))||1; const r=(size-thick)/2, cx=size/2, cy=size/2;
 let a0=-Math.PI/2, paths='';
 items.filter(i=>i.value>0).forEach(i=>{
  const a1=a0+2*Math.PI*i.value/total;
  const large=(a1-a0)>Math.PI?1:0;
  const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1-0.004), y1=cy+r*Math.sin(a1-0.004);
  paths+='<path d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+'" stroke="'+i.color+'" stroke-width="'+thick+'" fill="none"><title>'+esc(i.label)+': '+i.value+'</title></path>';
  a0=a1;
 });
 if(!paths) paths='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" stroke="#e8edf5" stroke-width="'+thick+'" fill="none"/>';
 return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+paths+'<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="'+(size/6.5)+'" font-weight="800" fill="#1b2537">'+sum(items.map(i=>i.value))+'</text><text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="9.5" fill="#94a3b8">'+esc(centerLabel||'всего')+'</text></svg>';
}

function vbarsSVG(items, w, h){
 w=w||420; h=h||170; const max=Math.max(...items.map(i=>i.value),1);
 const bw=Math.min(46,(w-30)/items.length-10); const step=(w-20)/items.length;
 let s='';
 for(let g=0;g<=4;g++){ const y=h-24-(h-44)*g/4; s+='<line x1="20" y1="'+y+'" x2="'+(w-6)+'" y2="'+y+'" stroke="#eef2f8"/><text x="16" y="'+(y+3)+'" text-anchor="end" font-size="8.5" fill="#b0bccd">'+Math.round(max*g/4)+'</text>'; }
 items.forEach((i,idx)=>{ const x=24+idx*step; const bh=(h-44)*i.value/max;
  s+='<rect x="'+x+'" y="'+(h-24-bh)+'" width="'+bw+'" height="'+Math.max(bh,1)+'" rx="4" fill="'+i.color+'"><title>'+esc(i.label)+': '+i.value+'</title></rect>';
  s+='<text x="'+(x+bw/2)+'" y="'+(h-28-bh)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">'+(i.value||'')+'</text>';
  const lbl=i.label.length>9?i.label.slice(0,8)+'…':i.label;
  s+='<text x="'+(x+bw/2)+'" y="'+(h-10)+'" text-anchor="middle" font-size="8.5" fill="#94a3b8">'+esc(lbl)+'</text>';
 });
 return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" style="max-width:'+w+'px">'+s+'</svg>';
}
function lineSVG(series, labels, w, h){
 w=w||460; h=h||180;
 const all=series.flatMap(s=>s.points); const max=Math.max(...all,1);
 const px=i=>30+(w-44)*i/Math.max(labels.length-1,1); const py=v=>h-26-(h-48)*v/max;
 let s='';
 for(let g=0;g<=4;g++){ const y=h-26-(h-48)*g/4; s+='<line x1="28" y1="'+y+'" x2="'+(w-8)+'" y2="'+y+'" stroke="#eef2f8"/><text x="24" y="'+(y+3)+'" text-anchor="end" font-size="8.5" fill="#b0bccd">'+Math.round(max*g/4)+'</text>'; }
 labels.forEach((l,i)=>{ if(labels.length<=10||i%2===0) s+='<text x="'+px(i)+'" y="'+(h-10)+'" text-anchor="middle" font-size="8.5" fill="#94a3b8">'+esc(l)+'</text>'; });
 series.forEach(se=>{
  const pts=se.points.map((v,i)=>px(i).toFixed(1)+','+py(v).toFixed(1)).join(' ');
  s+='<polyline points="'+pts+'" fill="none" stroke="'+se.color+'" stroke-width="2.2" stroke-linejoin="round"/>';
  se.points.forEach((v,i)=>{ s+='<circle cx="'+px(i)+'" cy="'+py(v)+'" r="2.6" fill="#fff" stroke="'+se.color+'" stroke-width="1.8"><title>'+esc(se.name)+' · '+esc(labels[i])+': '+v+'</title></circle>'; });
 });
 return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" style="max-width:'+w+'px">'+s+'</svg>';
}
function hbarsHTML(items, unit, maxOverride){
 const max=maxOverride||Math.max(...items.map(i=>i.value),1);
 return items.map(i=>'<div class="hbar-row"><span class="hl" title="'+esc(i.label)+'">'+esc(i.label)+'</span><div class="hbar-track"><i style="width:'+clamp(100*i.value/max,0,100)+'%;background:'+(i.color||'#2563eb')+'"></i></div><span class="hv">'+fmtN(i.value)+(unit||'')+'</span></div>').join('');
}

App.doLogin=async function(){
 const err=$('#login-err'); const login=val('login-user')||App.loginSel; const pass=val('login-pass');
 if(!login||!pass){ err.textContent='Введите логин и пароль'; return; }
 err.textContent='Проверка на сервере…';
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,password:pass})});
  const j=await r.json();
  if(!j.ok){ err.textContent=(j.error||{}).message||'Вход отклонён'; return; }
  DB=j.state; App.user=DB.users.find(u=>u.id===DB.me); App.lastSync=new Date(); App.loginSel=login;
  App.view=can('dash','view')?'dash':'portfolio';
  renderShell(); startPolling();
  toast('ok','Добро пожаловать, '+App.user.name+'!','Роль: '+ROLES[App.user.role].name+' · доступные модули определены матрицей прав');
 }catch(e){ err.textContent='Сервер недоступен: '+e.message; }
};

 stopPolling(); App.user=null; renderLogin();

 push('Проекты', DB.projects.filter(p=>(p.name+' '+p.code).toLowerCase().includes(q)).slice(0,4).map(p=>({t:p.name,s:p.code,go:()=>openProject(p.id)})));

function deviations(){
 const out=[];
 DB.tasks.filter(t=>t.type!=='milestone').forEach(t=>{
  if(taskOverdue(t)) out.push({kind:t.type==='directive'?'Поручение':'Задача',sev:'err',icon:'alert',title:t.title,sub:t.code+' · '+(P(t.projectId)||{}).code+' · просрочка '+overDays(t)+' '+plural(overDays(t),'день','дня','дней')+' · '+U(t.assignee).name,task:t});
 });
 DB.tasks.filter(t=>t.type==='milestone'&&taskOverdue(t)).forEach(t=>out.push({kind:'Контрольная точка',sev:'err',icon:'milestone',title:'Сорвана контрольная точка: '+t.title,sub:(P(t.projectId)||{}).code+' · план '+fmtD(t.end)+' · сдвиг '+overDays(t)+' дн',task:t}));
 DB.tasks.filter(t=>t.status==='Заблокирована').forEach(t=>out.push({kind:'Блокировка',sev:'warn',icon:'blocked',title:t.title,sub:t.code+' · причина: '+(t.blockReason||'не указана'),task:t}));
 DB.projects.filter(p=>!['Завершён','Архивный','Отменён'].includes(p.status)).forEach(p=>{
  Object.entries(p.baseline||{}).forEach(([tid,b])=>{ const t=T_(tid); if(t&&t.end>b.end&&!DONE_ST.includes(t.status)) out.push({kind:'Базовый план',sev:'warn',icon:'gantt',title:'Сдвиг относительно базового плана: '+t.title,sub:p.code+' · базовый финиш '+fmtD(b.end)+' → текущий '+fmtD(t.end)+' (+'+diffD(t.end,b.end)+' дн)',task:t}); });
  const used=projActualHours(p.id);
  if(used>p.budgetHours*0.95) out.push({kind:'Трудозатраты',sev:'warn',icon:'clock',title:'Приближение к лимиту трудоёмкости: '+p.name,sub:p.code+' · '+fmtN(used)+' из '+fmtN(p.budgetHours)+' чел·ч ('+Math.round(100*used/p.budgetHours)+'%)',proj:p});
  if(p.status==='Требует внимания') out.push({kind:'Проект',sev:'warn',icon:'folder',title:'Проект требует внимания руководства',sub:p.code+' · '+p.name,proj:p});
 });
 DB.risks.filter(r=>r.status!=='Закрыт'&&r.review<dISO(TODAY)).forEach(r=>out.push({kind:'Риск',sev:'warn',icon:'alert',title:'Пропущен срок пересмотра риска: '+r.title,sub:r.code+' · план пересмотра '+fmtD(r.review),risk:r}));
 DB.users.filter(u=>['exec','pm'].includes(u.role)).forEach(u=>{
  for(let i=0;i<7;i++){ const day=D(i); const l=userLoad(u.id,day);
   if(l.pct>DB.settings.loadOver){ out.push({kind:'Ресурсы',sev:'warn',icon:'users',title:'Перегрузка: '+u.name+' · '+fmtD(day),sub:l.pct+'% при норме '+l.cap+' ч · задач: '+l.tasks.length,user:u}); break; } }
 });
 return out;
}

function weeklyHours(n){
 const labels=[],plan=[],fact=[];
 const mon=mondayOf(TODAY);
 for(let w=n-1;w>=0;w--){
  const ws=dISO(new Date(parseD(mon).getTime()-w*7*DAY)), we=dISO(new Date(parseD(ws).getTime()+6*DAY));
  labels.push(fmtDs(ws));
  let pl=0;
  DB.tasks.forEach(t=>{ if(t.type==='milestone'||!t.planHours)return;
   const a=t.start>ws?t.start:ws, b=t.end<we?t.end:we;
   if(a<=b) pl+=t.planHours/workdays(t.start,t.end)*workdays(a,b);
  });
  plan.push(Math.round(pl));
  fact.push(Math.round(sum(DB.time.filter(x=>x.date>=ws&&x.date<=we&&x.status!=='Отклонена'&&x.status!=='Черновик').map(x=>x.hours))));
 }
 return {labels,plan,fact};
}

  rpc('task.update',{id:tid,...data}).then(r=>{if(r){App.closeModal(true);openTask(tid);}});
 }else{
  rpc('task.create',{...data,initialStatus:App._tmStatus||'Черновик'}).then(r=>{App._tmStatus=null;if(r){App.closeModal(true);openTask(r.id);}});
 }

function taskAllowedNext(t){
 let nexts=(T_TRANS[t.status]||[]).slice();
 if(App.user.role==='exec') nexts=nexts.filter(s=>(EXEC_TRANS[t.status]||[]).includes(s));
 if(nexts.includes('Принята')&&!can('tasks','approve',t)) nexts=nexts.filter(s=>s!=='Принята');
 return nexts;
}

App.taskStatus=function(tid,s,skipConfirm){
 const t=T_(tid);
 if(!(T_TRANS[t.status]||[]).includes(s)){toast('err','Недопустимый переход','Workflow: «'+t.status+'» → «'+s+'» запрещён (ТЗ M02 §1.9.1)');return false;}
 if(App.user.role==='exec'&&!(EXEC_TRANS[t.status]||[]).includes(s)){deny('tasks','edit',t);return false;}
 if(s==='Принята'&&!can('tasks','approve',t)){deny('tasks','approve',t);return false;}
 if(s==='На проверке'&&!t.result&&!skipConfirm){
  openModal(mh('Результат выполнения обязателен','check')+'<div class="mb form"><div class="help-note">'+ic('info')+'<div>Перевод в «На проверке» требует описания результата — обязательное поле workflow (проверяется ядром).</div></div>'+field('Что сделано / где результат',ta('ts-result','',3),true)+'</div><div class="mf"><button class="btn" onclick="App.closeModal()">Отмена</button><button class="btn pri" onclick="App.tsResultSave(\''+tid+'\')">'+ic('check')+' Передать на проверку</button></div>');
  return false;
 }
 if(s==='Заблокирована'&&!t.blockReason&&!skipConfirm){
  openModal(mh('Причина блокировки обязательна','blocked')+'<div class="mb form">'+field('Что блокирует выполнение',ta('ts-block','',3),true)+'</div><div class="mf"><button class="btn" onclick="App.closeModal()">Отмена</button><button class="btn danger" onclick="App.tsBlockSave(\''+tid+'\')">Заблокировать</button></div>');
  return false;
 }
 const payload={id:tid,to:s};
 if(App._tsResult){payload.result=App._tsResult;App._tsResult=null;}
 if(App._tsBlock){payload.blockReason=App._tsBlock;App._tsBlock=null;}
 rpc('task.status',payload).then(r=>{if(r)openTask(tid);});
 return true;
};

function transPath(from,to,exec){
 /* поиск допустимой цепочки переходов (BFS, глубина ≤ 4) */
 const graph=exec?EXEC_TRANS:T_TRANS;
 if(from===to)return [];
 const q=[[from]], seen=new Set([from]);
 while(q.length){
  const path=q.shift(); const last=path[path.length-1];
  if(path.length>3)continue;
  for(const nx of (graph[last]||[])){
   if(nx===to)return [...path.slice(1),nx];
   if(!seen.has(nx)){seen.add(nx);q.push([...path,nx]);}
  }
 }
 return null;
}

 const path=transPath(t.status,col.target,isExec);

function criticalPath(ts){
 const byId=Object.fromEntries(ts.map(t=>[t.id,t]));
 const dur=t=>diffD(t.end,t.start)+1;
 const memo={};
 const dist=id=>{ if(memo[id]!==undefined)return memo[id]; const t=byId[id]; if(!t)return 0;
  let best=0; t.deps.forEach(d=>{ if(byId[d.id])best=Math.max(best,dist(d.id)+(d.lag||0)); });
  return memo[id]=best+dur(t);
 };
 ts.forEach(t=>dist(t.id));
 let endId=null,best=-1; ts.forEach(t=>{if(memo[t.id]>best){best=memo[t.id];endId=t.id;}});
 const set=new Set(); let cur=endId;
 while(cur){ set.add(cur); const t=byId[cur]; if(!t)break;
  let bp=null,bv=-1; t.deps.forEach(d=>{ if(byId[d.id]&&memo[d.id]>bv){bv=memo[d.id];bp=d.id;} });
  cur=bp;
 }
 return set;
}

Views.resources=function(){
 const us=DB.users.filter(u=>['exec','pm','head'].includes(u.role)&&!u.blocked);
 const days=[...Array(14)].map((_,i)=>D(i));

  if(l.weekend)return {bg:'#f6f8fb',c:'#c3cddc'};
  if(l.pct>DB.settings.loadOver)return {bg:'#fee2e2',c:'#b91c1c'};
  if(l.pct>DB.settings.loadWarn)return {bg:'#fef3c7',c:'#b45309'};
  if(l.pct===0)return {bg:'#f1f5f9',c:'#94a3b8'};
  return {bg:'#dcfce7',c:'#15803d'};
 };
 return '<div class="page-head"><div><h2>Загрузка сотрудников</h2><div class="desc">Плановая загрузка на 14 дней: сумма плановых часов активных задач M02, распределённых по рабочим дням, относительно нормы сотрудника. Перегрузка > '+DB.settings.loadOver+'% выделяется красным; недоступность (отпуск) — отдельным статусом, а не нулём.</div></div>'+
 '<div class="acts">'+(can('resources','export')?'<button class="btn" onclick="App.resExport()">'+ic('excel')+' Экспорт</button>':'')+'</div></div>'+
 '<div class="card mb14"><div class="ch">'+ic('users')+'Матрица загрузки, % от нормы<span class="r legend"><span class="li"><span class="sw" style="background:#dcfce7"></span>≤ '+DB.settings.loadWarn+'%</span><span class="li"><span class="sw" style="background:#fef3c7"></span>'+DB.settings.loadWarn+'–'+DB.settings.loadOver+'%</span><span class="li"><span class="sw" style="background:#fee2e2"></span>перегрузка</span><span class="li"><span class="sw" style="background:#e2e8f0"></span>недоступен</span></span></div>'+
 '<div class="cb" style="overflow:auto"><table class="hm"><thead><tr><th style="text-align:left">Сотрудник</th>'+days.map(d=>'<th class="'+(isWk(d)?'wkend':'')+'">'+fmtDs(d)+'<br>'+['вс','пн','вт','ср','чт','пт','сб'][parseD(d).getDay()]+'</th>').join('')+'<th>Среднее</th></tr></thead><tbody>'+
 us.map(u=>{
  const ls=days.map(d=>userLoad(u.id,d));
  const work=ls.filter(l=>!l.abs&&!l.weekend);
  const avg=work.length?Math.round(sum(work.map(l=>l.pct))/work.length):0;
  return '<tr><td class="rowname"><div class="flex">'+avatar(u,'sm')+'<span>'+esc(u.name)+'</span></div></td>'+
   ls.map((l,i)=>{const c=cellColor(l);
    const tip=l.abs?u.name+' · '+fmtD(days[i])+' · недоступен: '+l.abs:(l.weekend?'Выходной':fmtD(days[i])+' · назначено '+l.hours+' ч из '+l.cap+' ч · '+l.pct+'% · задач: '+l.tasks.length+(l.tasks.length?' ('+l.tasks.map(t=>t.code).join(', ')+')':''));
    return '<td><div class="cell" style="background:'+c.bg+';color:'+c.c+'" title="'+esc(tip)+'" onclick="App.resCell(\''+u.id+'\',\''+days[i]+'\')">'+(l.abs?'<small>'+esc(l.abs)+'</small>':(l.weekend?'·':l.pct+'%'))+(l.hours?'<small>'+l.hours+' ч</small>':'')+'</div></td>';
   }).join('')+
   '<td><b style="color:'+(avg>DB.settings.loadOver?'var(--err)':avg>DB.settings.loadWarn?'var(--warn)':'var(--ok)')+'">'+avg+'%</b></td></tr>';
 }).join('')+'</tbody></table></div></div>'+
 '<div class="grid g2">'+
  '<div class="card"><div class="ch">'+ic('tasks')+'Назначения по сотрудникам</div><div class="cb list-rows">'+
   us.map(u=>{const ts=DB.tasks.filter(t=>t.assignee===u.id&&ACTIVE_ST.includes(t.status));
    return '<div class="lr" onclick="App.resCard(\''+u.id+'\')">'+avatar(u)+'<div class="lt"><b>'+esc(u.name)+'</b><small>'+esc(u.position)+'</small></div><span class="chip">'+ts.length+' задач</span><span class="chip">'+fmtN(sum(ts.map(t=>t.planHours)))+' ч</span>'+ic('chevR')+'</div>';}).join('')+
  '</div></div>'+
  '<div class="card"><div class="ch">'+ic('alert')+'Конфликты ресурсов</div><div class="cb">'+
   (()=>{const conf=[];
    us.forEach(u=>days.forEach(d=>{const l=userLoad(u.id,d);if(l.pct>DB.settings.loadOver)conf.push({u,d,l});}));
    const uniqConf=[];const seen=new Set();
    conf.forEach(c=>{const k=c.u.id+c.d;if(!seen.has(k)){seen.add(k);uniqConf.push(c);}});
    if(!uniqConf.length)return emptyBlock('Конфликтов нет','Перегрузок в горизонте 14 дней не выявлено','check');
    return '<div class="list-rows">'+uniqConf.slice(0,8).map(c=>'<div class="lr" onclick="App.resCell(\''+c.u.id+'\',\''+c.d+'\')"><span style="color:var(--err)">'+ic('alert')+'</span><div class="lt"><b>'+esc(c.u.name)+' · '+fmtD(c.d)+'</b><small>'+c.l.hours+' ч при норме '+c.l.cap+' ч · задач: '+c.l.tasks.map(t=>t.code).join(', ')+'</small></div><b style="color:var(--err)">'+c.l.pct+'%</b></div>').join('')+'</div>';})()+
  '</div></div>'+
 '</div>';
};

function riskMatrixHTML(compact){
 const open=DB.risks.filter(r=>r.status!=='Закрыт');
 let html='<div class="matrix" style="'+(compact?'':'max-width:520px')+'">';
 html+='<div class="ax">P \\ I</div>';
 for(let i=1;i<=5;i++)html+='<div class="ax">'+i+'</div>';
 for(let p=5;p>=1;p--){
  html+='<div class="ax">'+p+'</div>';
  for(let i=1;i<=5;i++){
   const n=open.filter(r=>r.p===p&&r.i===i).length;
   const lv=RISK_LEVEL(p*i);
   html+='<div class="mx'+(n?'':' zero')+'" style="background:'+lv.c+(n?'':'99')+'" title="P='+p+' · I='+i+' · балл '+p*i+' ('+lv.n+') · рисков: '+n+'" onclick="App.riskMatrixFilter('+p+','+i+')">'+(n||'·')+'</div>';
  }
 }
 html+='</div><div class="small mut mt8">Вероятность P (1–5) × Влияние I (1–5). Уровни: ≤4 низкий · 5–9 умеренный · 10–14 высокий · ≥15 критический.</div>';
 return html;
}

App.docSave=async function(did,newVersion){
 const fi=document.getElementById('dm-file'); const file=fi&&fi.files[0];
 const note=val('dm-note');
 if(newVersion){
  const d=DOC(did);
  const fileName=file?file.name:('document_v'+(d.versions.length+1)+'.docx');
  const r=await rpc('doc.version',{id:did,fileName,fileSize:file?file.size:250000,note:note||'Обновлённая редакция'});
  if(!r)return;
  if(file){ const up=await uploadDocFile(did,r.versions[r.versions.length-1].v,file); if(!up)return; }
  App.closeModal(true); openDoc(did); return;
 }
 if(!requireFields(['dm-title']))return;
 const data={title:val('dm-title'),type:val('dm-type'),projectId:val('dm-proj'),taskId:val('dm-task')||null,
  fileName:file?file.name:'document_v1.docx',fileSize:file?file.size:250000,note:note||'Первая редакция'};
 const r=await rpc('doc.create',data);
 if(!r)return;
 if(file){ const up=await uploadDocFile(r.id,1,file); if(!up)return; }
 App.closeModal(true); openDoc(r.id);
};

App.calcRun=function(){
 const w=App._wiz; const m=CALC_MODELS[w.model];
 if(!requireFields(['cw-title']))return;
 const inputs={}; let bad=null;
 m.inputs.forEach(i=>{ const v=num('cw-'+i.k);
  if(isNaN(v)||v<i.min||v>i.max)bad=bad||i;
  inputs[i.k]=v;
 });
 if(bad){$('#cw-msg').textContent='Параметр «'+bad.n+'»: допустимый диапазон '+bad.min+' … '+bad.max+' '+bad.u;return;}
 const title=val('cw-title'), projectId=val('cw-proj'), taskId=val('cw-task')||null;
 rpc('calc.run',{model:w.model,title,projectId,taskId,inputs}).then(r=>{if(r){App.closeModal(true);openCalc(r.id);}});
};

App.calcRerunSave=function(cid){
 const c=CAL(cid); const m=CALC_MODELS[c.model];
 const inputs={}; let bad=null;
 m.inputs.forEach(i=>{const v=num('cr-'+i.k); if(isNaN(v)||v<i.min||v>i.max)bad=bad||i; inputs[i.k]=v;});
 if(bad){$('#cr-msg').textContent='Параметр «'+bad.n+'»: диапазон '+bad.min+' … '+bad.max;return;}
 rpc('calc.rerun',{id:cid,inputs}).then(r=>{if(r){App.closeModal(true);openCalc(cid);}});
};

/* ---------- M12: календарь ---------- */
function collectCalEvents(){
 const evs=[];
 DB.tasks.forEach(t=>{
  if(t.status==='Отменена')return;
  if(t.type==='milestone')evs.push({date:t.end,title:'◆ '+t.title,kind:'Контрольная точка',color:'#7c3aed',icon:'milestone',go:'openTask(\''+t.id+'\')'});
  else if(!DONE_ST.includes(t.status))evs.push({date:t.end,title:t.title,kind:'Срок задачи',color:taskOverdue(t)?'#dc2626':'#0891b2',icon:'tasks',go:'openTask(\''+t.id+'\')'});
 });
 DB.meetings.forEach(m=>evs.push({date:m.date,time:m.time,title:m.title,kind:'Совещание',color:'#2563eb',icon:'meeting',go:'openMeeting(\''+m.id+'\')'}));
 DB.risks.forEach(r=>{if(r.status!=='Закрыт')evs.push({date:r.review,title:'Пересмотр: '+r.title,kind:'Риск',color:'#d97706',icon:'alert',go:'openRisk(\''+r.id+'\')'});});
 DB.calEvents.forEach(e=>evs.push({date:e.date,time:e.time,title:e.title,kind:'Событие',color:'#16a34a',icon:'calendar',go:'App.calEventOpen(\''+e.id+'\')'}));
 return evs;
}
Views.calendar=function(){
 const c=App.cal;
 const f=App.f.cal=App.f.cal||{kinds:{}};
 const first=new Date(c.y,c.m,1);
 const startOff=(first.getDay()+6)%7;
 const monthName=first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
 let evs=collectCalEvents();
 const kinds=['Совещание','Срок задачи','Контрольная точка','Риск','Событие'];
 evs=evs.filter(e=>f.kinds[e.kind]!==false);
 const cells=[];
 for(let i=0;i<42;i++){
  const d=new Date(c.y,c.m,1-startOff+i);
  const iso=dISO(d);
  const dim=d.getMonth()!==c.m;
  const dayEvs=evs.filter(e=>e.date===iso).sort((a,b)=>(a.time||'')<(b.time||'')?-1:1);
  cells.push('<div class="cal-cell'+(dim?' dim':'')+(iso===dISO(TODAY)?' today':'')+'" onclick="App.calDay(\''+iso+'\')"><div class="dn">'+d.getDate()+'</div>'+
   dayEvs.slice(0,3).map(e=>'<div class="cal-ev" style="border-color:'+e.color+';background:'+e.color+'14;color:'+e.color+'" title="'+esc(e.title)+'">'+esc(e.title)+'</div>').join('')+
   (dayEvs.length>3?'<div class="cal-more">ещё '+(dayEvs.length-3)+'…</div>':'')+'</div>');
 }
 return '<div class="page-head"><div><h2>Календарь</h2><div class="desc">Единая лента событий: сроки задач и вехи (M02), совещания (M16), пересмотры рисков (M08) и события подразделения. Данные не дублируются — календарь читает модули-источники.</div></div>'+
 '<div class="acts">'+(can('calendar','create')?'<button class="btn pri" onclick="App.calEventModal()">'+ic('plus')+' Событие</button>':'')+'</div></div>'+
 '<div class="filters">'+
  '<button class="btn sm" onclick="App.calNav(-1)">'+ic('chevL')+'</button><b style="font-size:15px;text-transform:capitalize">'+monthName+'</b><button class="btn sm" onclick="App.calNav(1)">'+ic('chevR')+'</button>'+
  '<button class="btn sm ghost" onclick="App.calToday()">сегодня</button>'+
  '<span class="spacer"></span>'+
  kinds.map(k=>{const col={'Совещание':'#2563eb','Срок задачи':'#0891b2','Контрольная точка':'#7c3aed','Риск':'#d97706','Событие':'#16a34a'}[k];
   return '<label class="checkline" style="font-size:11.5px"><input type="checkbox" '+(f.kinds[k]!==false?'checked':'')+' onchange="App.f.cal.kinds[\''+k+'\']=this.checked;renderView()"><span style="color:'+col+'">●</span> '+k+'</label>';}).join('')+
 '</div>'+
 '<div class="cal-grid">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>'<div class="cw">'+d+'</div>').join('')+cells.join('')+'</div>';
};

App.restore=function(input){
 const f=input.files[0]; if(!f)return;
 const rd=new FileReader();
 rd.onload=async()=>{
  try{
   const d=JSON.parse(rd.result);
   if(!d||!d.tables)throw new Error('формат не распознан: ожидается резервная копия СУП-ИП (поле tables)');
   if(!confirm('Восстановить БД из копии '+f.name+'? Текущие данные будут полностью заменены.')){input.value='';return;}
   const r=await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:rd.result});
   const j=await r.json();
   if(!j.ok){toast('err','Не удалось восстановить',(j.error||{}).message||'');return;}
   toast('ok','База восстановлена',f.name+' · все клиенты получат обновлённое состояние');
   if(j.relogin){stopPolling();App.user=null;renderLogin();return;}
   const st=await fetch('/api/state'); const sj=await st.json();
   if(sj.ok&&sj.state){DB=sj.state;App.user=DB.users.find(u=>u.id===DB.me)||App.user;renderShell();}
  }catch(e){toast('err','Не удалось восстановить',e.message);}
  input.value='';
 };
 rd.readAsText(f);
};

 '</div>'+
 '<div class="card"><div class="tbl-wrap" style="max-height:560px"><table class="tbl"><thead><tr><th>Время</th><th>Категория</th><th>Уровень</th><th>Пользователь</th><th>Модуль</th><th>Действие</th><th>Объект</th></tr></thead><tbody>'+
 (rows.length?rows.slice(0,200).map(e=>'<tr onclick="App.jrOpen(\''+e.id+'\')"><td class="small nowrap">'+fmtDT(e.ts)+'</td><td><span class="tag" style="background:'+(EV_CATS[e.cat]||{}).c+'18;color:'+(EV_CATS[e.cat]||{}).c+'">'+e.cat+'</span></td><td><span style="color:'+(e.level==='error'?'var(--err)':e.level==='warning'?'var(--warn)':'var(--mut2)')+'">●</span> <span class="small">'+e.level+'</span></td><td class="small">'+esc(U(e.user).name)+'</td><td class="small nowrap">'+(MOD[e.module]?MOD[e.module].code:e.module)+'</td><td><b class="small">'+esc(e.action)+'</b></td><td class="small">'+esc(e.obj)+(e.objId?' · '+esc(e.objId):'')+'</td></tr>').join(''):'<tr class="nohover"><td colspan="7">'+emptyBlock('События не найдены','Измените фильтры','journal')+'</td></tr>')+
 '</tbody></table></div></div>';
};
App.jrOpen=function(eid){
 const e=DB.events.find(x=>x.id===eid); if(!e)return;
 openDrawer(dh(e.cat+' · '+e.level,e.action,'<span class="tag" style="background:'+(EV_CATS[e.cat]||{}).c+'18;color:'+(EV_CATS[e.cat]||{}).c+'">'+e.cat+'</span> <span class="chip">'+fmtDT(e.ts)+'</span>')+
 '<div class="db">'+
  '<div class="stat-line"><span>Пользователь</span><b>'+esc(U(e.user).name)+'</b></div>'+
  '<div class="stat-line"><span>Модуль</span><b>'+(MOD[e.module]?MOD[e.module].code+' · '+MOD[e.module].name:e.module)+'</b></div>'+
  '<div class="stat-line"><span>Объект</span><b>'+esc(e.obj)+' '+esc(e.objId)+'</b></div>'+
  '<div class="stat-line"><span>Идентификатор записи</span><b>'+e.id+'</b></div>'+
  '<h4 style="margin:14px 0 6px">Полезная нагрузка (before / after)</h4>'+
  '<div class="codebox">'+esc(JSON.stringify(e.details,null,2))+'</div>'+
  (e.objId&&T_(e.objId)?'<button class="btn mt14" onclick="App.closeDrawer();openTask(\''+e.objId+'\')">'+ic('tasks')+' Открыть задачу</button>':'')+
  (e.objId&&P(e.objId)?'<button class="btn mt14" onclick="App.closeDrawer();openProject(\''+e.objId+'\')">'+ic('folder')+' Открыть проект</button>':'')+
 '</div><div class="df"><button class="btn" onclick="App.closeDrawer()">Закрыть</button></div>');
};
App.jrExport=function(){ if(!guard('journal','export'))return;
 exportCSV('zhurnal_sobytiy.csv',[['Время','Категория','Уровень','Пользователь','Модуль','Действие','Объект','ID объекта','Детали'],...DB.events.map(e=>[new Date(e.ts).toLocaleString('ru-RU'),e.cat,e.level,U(e.user).name,(MOD[e.module]||{}).code||e.module,e.action,e.obj,e.objId,JSON.stringify(e.details)])]);
 toast('ok','Журнал выгружен','CSV (Excel) · INTEGRATION в M15');
};

/* ---------- Запуск приложения: bootstrap, поллинг состояния ---------- */
window.addEventListener('error',ev=>{
 try{ if(DB&&App.user){ log('TECH','error',App.view||'dash','Ошибка интерфейса: '+ev.message,'Web UI','',{}); } }catch(e){}
});
document.addEventListener('keydown',e=>{
 App._lastAct=Date.now();
 if(e.key==='Escape'){
  if($('#modal-root').innerHTML)App.closeModal();
  else if($('#drawer-root').innerHTML)App.closeDrawer();
  const sp=$('#search-pop'); if(sp)sp.innerHTML='';
  const np=$('#notif-pop'); if(np)np.remove();
 }
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); const s=$('#gsearch'); if(s)s.focus(); }
});
document.addEventListener('pointerdown',()=>{App._lastAct=Date.now();});
let POLL=null;
function startPolling(){ if(!POLL) POLL=setInterval(pollState, 12000); }
function stopPolling(){ if(POLL){ clearInterval(POLL); POLL=null; } }
async function pollState(){
 if(!App.user||!DB) return;
 try{
  const r=await fetch('/api/state?rev='+DB.rev);
  if(r.status===401){ stopPolling(); App.user=null; renderLogin(); toast('info','Сессия завершена','Неактивность или выход на другом устройстве. Войдите заново.'); return; }
  const j=await r.json();
  if(j.ok && !j.same && j.state){
   DB=j.state; App.user=DB.users.find(u=>u.id===DB.me)||App.user;
   const modalOpen=$('#modal-root') && $('#modal-root').innerHTML;
   if(!modalOpen){ renderView(); } /* не перерисовываем под открытой формой */
   updateNotifBadge(); dbSave();
  }
 }catch(e){ /* сервер временно недоступен — повторим через 12 с */ }
}
(async function boot(){
 App._lastAct=Date.now();
 try{
  const r=await fetch('/api/bootstrap'); const j=await r.json();
  SERVER=j.server||SERVER;
  if(j.authed && j.state){
   DB=j.state; App.user=DB.users.find(u=>u.id===DB.me); App.lastSync=new Date();
   App.view=can('dash','view')?'dash':'portfolio';
   renderShell(); startPolling();
  } else renderLogin();
 }catch(e){
  $('#app').innerHTML='<div class="login-wrap"><div class="login-box"><div class="login-right"><h2>Сервер недоступен</h2><div class="hint">Не удалось соединиться с сервером СУП-ИП. Убедитесь, что сервер запущен (run.bat / служба), и обновите страницу.</div><button class="btn pri" onclick="location.reload()">Повторить</button></div></div></div>';
 }
})();

</script>
